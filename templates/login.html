<!DOCTYPE html>
<html>

<head>

    <title>School Account Login</title>

    <style>

        body {
            font-family: Arial;
            background: #f4f6f8;
        }

        .login-box {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
        }

        .notice {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h2>School Account</h2>

    <p>Please sign in to verify your account.</p>

    <form action="/login" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Sign In
        </button>

    </form>

    <div class="notice">
        Classroom simulation — never enter your real password.
    </div>

</div>

</body>

</html>
